<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Dodger 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#060512;color:#f1f5fd;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
  .pill{background:rgba(10,6,26,.72);border:1px solid rgba(194,122,255,.45);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700}
  .pill b{color:#c27aff}
  #pad{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;z-index:6;pointer-events:none}
  #pad .grp{display:flex;gap:12px;pointer-events:auto}
  .btn{width:66px;height:66px;border-radius:50%;border:1px solid rgba(194,122,255,.5);background:rgba(20,10,44,.7);
    color:#e9d5ff;font-size:24px;font-weight:800;backdrop-filter:blur(4px)}
  .btn:active{transform:scale(.94);background:rgba(90,40,160,.8)}
  #overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(5,3,16,.72);backdrop-filter:blur(6px)}
  #overlay.hide{display:none}
  #overlay .box{width:min(100%,420px);text-align:center;background:#14092e;border:1px solid #35245e;border-radius:18px;padding:32px 26px}
  #overlay h1{margin:0 0 8px;font-size:30px}
  #overlay p{margin:0 0 8px;color:#a99ac9;font-size:15px;line-height:1.6}
  #overlay .big{font-size:44px;font-weight:800;color:#c27aff;margin:8px 0}
  #startBtn{margin-top:16px;width:100%;height:54px;border:0;border-radius:12px;background:#c27aff;color:#2a0f4d;font-size:18px;font-weight:800;cursor:pointer}
  #back{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(64px + env(safe-area-inset-top));z-index:6;
    padding:8px 14px;border-radius:999px;background:rgba(10,6,26,.72);border:1px solid #35245e;color:#a99ac9;text-decoration:none;font-size:12px;font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="pill">Score <b id="score">0</b></div>
  <div class="pill">Coins <b id="coins">0</b></div>
  <div class="pill">Shield <b id="lives">🛡🛡🛡</b></div>
</div>
<div id="pad">
  <div class="grp"><button class="btn" id="leftBtn">◀</button><button class="btn" id="rightBtn">▶</button></div>
  <div class="grp"><button class="btn" id="jumpBtn">⤒</button></div>
</div>
<div id="overlay">
  <div class="box">
    <h1>🟪 Neon Dodger</h1>
    <p>Dodge the barriers, grab the rings.<br>Tall walls: switch lane. Low bars: <b>jump</b>.<br>Arrows / tap sides / swipe, Space to jump.</p>
    <div class="big" id="finalScore" style="display:none">0</div>
    <p id="best" style="display:none"></p>
    <button id="startBtn">Run</button>
  </div>
</div>
<a id="back" href="../">← Games</a>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const LANES=[-2,0,2];

const SFX={
  ctx:null,
  ensure(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{this.ctx=new C();}catch(e){return;}}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  tone(f,d=0.1,g=0.2,type='sine',slide=null){if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn);gn.connect(c.destination);o.start(t);o.stop(t+d+0.05);},
  coin(){this.tone(990,0.09,0.2,'square');setTimeout(()=>this.tone(1320,0.12,0.2,'square'),70);},
  jump(){this.tone(300,0.15,0.18,'sine',700);},
  hit(){this.tone(130,0.35,0.35,'sawtooth',35);},
  over(){[400,300,220,150].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,0.22,'triangle'),i*160));}
};

const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x060512);
scene.fog=new THREE.Fog(0x060512,12,34);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,100);
camera.position.set(0,3.4,6.4);camera.lookAt(0,1, -6);

scene.add(new THREE.HemisphereLight(0xb79cff,0x0a0618,0.9));
const neon=new THREE.PointLight(0xc27aff,30,30);neon.position.set(0,4,-6);scene.add(neon);
const front=new THREE.DirectionalLight(0xffffff,1.0);front.position.set(2,6,5);scene.add(front);

// track
const track=new THREE.Mesh(new THREE.PlaneGeometry(8,60),
  new THREE.MeshStandardMaterial({color:0x0d0a24,roughness:0.7}));
track.rotation.x=-Math.PI/2;track.position.z=-20;scene.add(track);
const grid=new THREE.GridHelper(60,30,0xc27aff,0x2a1a55);
grid.position.set(0,0.02,-20);grid.material.transparent=true;grid.material.opacity=0.4;scene.add(grid);
// lane dividers
for(const x of [-1,1]){
  const strip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.02,60),
    new THREE.MeshBasicMaterial({color:0xc27aff}));
  strip.position.set(x,0.03,-20);scene.add(strip);
}

// player
const player=new THREE.Group();
const pBody=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),
  new THREE.MeshStandardMaterial({color:0x22e0ff,emissive:0x0a5a7a,emissiveIntensity:0.9,roughness:0.3}));
pBody.position.y=0.55;pBody.castShadow=true;player.add(pBody);
const pEdge=new THREE.LineSegments(new THREE.EdgesGeometry(pBody.geometry),
  new THREE.LineBasicMaterial({color:0xbffbff}));
pEdge.position.copy(pBody.position);player.add(pEdge);
scene.add(player);

let lane=1,px=0,py=0,vy=0,jumping=false;
const obs=[],coins=[];
const wallMat=new THREE.MeshStandardMaterial({color:0xff3d81,emissive:0x7a0a35,emissiveIntensity:0.8,roughness:0.4});
const barMat=new THREE.MeshStandardMaterial({color:0xffaa22,emissive:0x7a4a00,emissiveIntensity:0.8,roughness:0.4});
const coinGeo=new THREE.TorusGeometry(0.32,0.12,10,20);
const coinMat=new THREE.MeshStandardMaterial({color:0xffd54a,emissive:0x8a6300,emissiveIntensity:1,roughness:0.25});

function spawnObs(){
  const l=Math.floor(rand(0,3));
  const low=Math.random()<0.4;
  let m;
  if(low){m=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.6,0.5),barMat);m.position.set(LANES[l],0.32,-32);m.userData={low:true};}
  else{m=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.2,0.5),wallMat);m.position.set(LANES[l],1.1,-32);m.userData={low:false};}
  scene.add(m);obs.push(m);
}
function spawnCoin(){
  const l=Math.floor(rand(0,3));
  const m=new THREE.Mesh(coinGeo,coinMat);
  m.position.set(LANES[l],0.9,-32);scene.add(m);coins.push(m);
}

let score=0,coinCount=0,lives=3,running=false,elapsed=0,speed=10,spawnT=0,coinT=1,lastT=0,invuln=0;
let best=+(localStorage.getItem('neonBest')||0);
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),livesEl=document.getElementById('lives'),
      overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),
      finalScore=document.getElementById('finalScore'),bestEl=document.getElementById('best');

function hud(){
  scoreEl.textContent=Math.floor(score);
  coinsEl.textContent=coinCount;
  livesEl.textContent='🛡'.repeat(Math.max(0,lives))||'—';
}
function reset(){
  for(const m of obs)scene.remove(m);obs.length=0;
  for(const m of coins)scene.remove(m);coins.length=0;
  score=0;coinCount=0;lives=3;elapsed=0;speed=10;spawnT=0.6;coinT=1;lane=1;px=0;py=0;vy=0;jumping=false;invuln=0;hud();
}
function gameOver(){
  running=false;SFX.over();
  const s=Math.floor(score);
  best=Math.max(best,s);localStorage.setItem('neonBest',best);
  finalScore.style.display='block';finalScore.textContent=s+' pts';
  bestEl.style.display='block';bestEl.textContent='Best: '+best+' pts · '+coinCount+' coins';
  startBtn.textContent='Run again';overlay.classList.remove('hide');
}
startBtn.addEventListener('click',()=>{SFX.ensure();reset();running=true;lastT=performance.now()/1000;overlay.classList.add('hide');});

function goLeft(){if(lane>0){lane--;}}
function goRight(){if(lane<2){lane++;}}
function jump(){if(!jumping){jumping=true;vy=6.2;SFX.jump();}}
document.getElementById('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.ensure();goLeft();});
document.getElementById('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.ensure();goRight();});
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.ensure();jump();});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')goLeft();
  if(e.code==='ArrowRight'||e.code==='KeyD')goRight();
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){jump();e.preventDefault();}
});
// swipe on canvas
let sx=null,sy=null;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;SFX.ensure();});
canvas.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24){
    // tap: left/right half to steer, top third to jump
    if(e.clientY<innerHeight*0.35)jump();
    else if(e.clientX<innerWidth/2)goLeft();else goRight();
  }else if(Math.abs(dx)>Math.abs(dy)){dx>0?goRight():goLeft();}
  else if(dy<-24)jump();
  sx=null;
});

function frame(){
  requestAnimationFrame(frame);
  const t=performance.now()/1000;
  let dt=Math.min(0.05,t-(lastT||t));lastT=t;
  if(document.hidden)dt=0;
  if(running&&dt>0){
    elapsed+=dt;speed=Math.min(24,10+elapsed*0.45);
    score+=dt*speed*2;
    // lane + jump physics
    px+=(LANES[lane]-px)*Math.min(1,dt*12);
    if(jumping){py+=vy*dt;vy-=16*dt;if(py<=0){py=0;jumping=false;vy=0;}}
    player.position.set(px,py,0);
    pBody.rotation.z=(LANES[lane]-px)*-0.2;
    player.rotation.y=Math.sin(t*2)*0.05;
    if(invuln>0){invuln-=dt;pBody.visible=Math.floor(t*12)%2===0;}else pBody.visible=true;

    spawnT-=dt;coinT-=dt;
    if(spawnT<=0){spawnT=Math.max(0.45,1.3-elapsed*0.025);spawnObs();if(speed>16&&Math.random()<0.5)spawnObs();}
    if(coinT<=0){coinT=rand(0.8,1.6);spawnCoin();}

    for(let i=obs.length-1;i>=0;i--){
      const m=obs[i];m.position.z+=speed*dt;
      if(m.position.z>7){scene.remove(m);obs.splice(i,1);continue;}
      if(Math.abs(m.position.z)<0.8&&Math.abs(m.position.x-px)<1.0&&invuln<=0){
        if(m.userData.low){
          if(py<0.45){ // clipped the bar
            lives--;invuln=1.2;SFX.hit();hud();if(lives<=0){gameOver();break;}
          }
        }else{
          lives--;invuln=1.2;SFX.hit();hud();if(lives<=0){gameOver();break;}
        }
      }
    }
    for(let i=coins.length-1;i>=0;i--){
      const m=coins[i];m.position.z+=speed*dt;m.rotation.y+=4*dt;
      if(m.position.z>7){scene.remove(m);coins.splice(i,1);continue;}
      const dx=m.position.x-px,dz=m.position.z;
      if(Math.abs(dz)<0.9&&Math.abs(dx)<0.8&&Math.abs(m.position.y-(0.55+py))<0.9){
        scene.remove(m);coins.splice(i,1);coinCount++;score+=25;SFX.coin();
      }
    }
    // scroll grid for speed feel
    grid.position.z=-20+((elapsed*speed)%2);
    hud();
  }
  renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();hud();frame();
</script>
</body>
</html>
