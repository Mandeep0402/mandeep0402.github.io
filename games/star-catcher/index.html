<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Star Catcher 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1120;color:#f1f5fd;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
  .pill{background:rgba(10,16,32,.72);border:1px solid rgba(94,234,212,.35);border-radius:999px;
    padding:8px 16px;font-size:15px;font-weight:700;letter-spacing:.3px;backdrop-filter:blur(4px)}
  .pill b{color:#5eead4}
  #flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(220,40,40,.55) 100%);opacity:0;transition:opacity .25s;z-index:4}
  #overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(5,8,18,.72);backdrop-filter:blur(6px)}
  #overlay.hide{display:none}
  #overlay .box{width:min(100%,420px);text-align:center;background:#16213b;border:1px solid #24304d;border-radius:18px;padding:32px 26px}
  #overlay h1{margin:0 0 8px;font-size:30px}
  #overlay p{margin:0 0 8px;color:#8b9bbd;font-size:15px;line-height:1.6}
  #overlay .big{font-size:44px;font-weight:800;color:#5eead4;margin:8px 0}
  #startBtn{margin-top:16px;width:100%;height:54px;border:0;border-radius:12px;background:#5eead4;color:#06281f;
    font-size:18px;font-weight:800;cursor:pointer}
  #startBtn:active{transform:translateY(2px)}
  #back{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
    padding:10px 16px;border-radius:999px;background:rgba(10,16,32,.72);border:1px solid #24304d;color:#8b9bbd;
    text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="pill">Score <b id="score">0</b></div>
  <div class="pill">Lives <b id="lives">♥♥♥</b></div>
  <div class="pill">Combo <b id="combo">x0</b></div>
</div>
<div id="flash"></div>
<div id="overlay">
  <div class="box">
    <h1>⭐ Star Catcher</h1>
    <p>Slide the basket to catch falling <b style="color:#ffd54a">stars</b>.<br>
    Avoid the <b style="color:#ff6b6b">bombs</b> — 3 hits ends the run.<br>
    Drag, move mouse, or use ← → keys.</p>
    <div class="big" id="finalScore" style="display:none">0</div>
    <p id="best" style="display:none"></p>
    <button id="startBtn">Start</button>
  </div>
</div>
<a id="back" href="../">← Games</a>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

// ---------- audio (tiny WebAudio SFX, like the roach game's engine) ----------
const SFX={
  ctx:null,
  ensure(){
    if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{this.ctx=new C();}catch(e){return;}}
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
  },
  tone(freq,dur=0.1,gain=0.25,type='sine',slide=null){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
  },
  catch(combo){this.tone(520+Math.min(combo,10)*60,0.12,0.25,'triangle',900+Math.min(combo,10)*60);},
  bomb(){this.tone(160,0.35,0.4,'sawtooth',40);},
  over(){[400,300,220,150].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,0.25,'triangle'),i*160));}
};

// ---------- three.js setup ----------
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1120);
scene.fog=new THREE.Fog(0x0b1120,12,30);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,100);
camera.position.set(0,4.4,7.6);camera.lookAt(0,1.2,0);

scene.add(new THREE.HemisphereLight(0xbdd8ff,0x1a1430,0.9));
const sun=new THREE.DirectionalLight(0xffffff,1.6);
sun.position.set(4,8,5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-6;sun.shadow.camera.right=6;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-2;
scene.add(sun);
const rim=new THREE.PointLight(0x5eead4,12,20);rim.position.set(-4,3,-2);scene.add(rim);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x111a2e,roughness:0.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(20,20,0x5eead4,0x24304d);
grid.position.y=0.01;grid.material.transparent=true;grid.material.opacity=0.35;scene.add(grid);

// ---------- basket ----------
const basket=new THREE.Group();
const bMat=new THREE.MeshStandardMaterial({color:0x5eead4,roughness:0.4,metalness:0.2});
const base=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.15,1.0),bMat);
base.position.y=0.08;base.castShadow=true;basket.add(base);
for(const [w,d,x,z] of [[1.3,0.1,0,-0.45],[1.3,0.1,0,0.45],[0.1,1.0,-0.6,0],[0.1,1.0,0.6,0]]){
  const wall=new THREE.Mesh(new THREE.BoxGeometry(w,0.45,d),bMat);
  wall.position.set(x,0.35,z);wall.castShadow=true;basket.add(wall);
}
basket.position.set(0,0.35,1.6);scene.add(basket);
let basketX=0,targetX=0;

// ---------- falling items ----------
const starGeo=new THREE.OctahedronGeometry(0.32);
const starMat=new THREE.MeshStandardMaterial({color:0xffd54a,emissive:0xaa7700,emissiveIntensity:0.9,roughness:0.3});
const bombGeo=new THREE.SphereGeometry(0.32,18,14);
const bombMat=new THREE.MeshStandardMaterial({color:0x1a1a22,roughness:0.4,metalness:0.6});
const fuseMat=new THREE.MeshStandardMaterial({color:0xff4444,emissive:0xff0000,emissiveIntensity:1.2});
const items=[];

function spawnItem(speedMul){
  const isBomb=Math.random()<0.26;
  const m=new THREE.Mesh(isBomb?bombGeo:starGeo,isBomb?bombMat:starMat);
  m.castShadow=true;
  if(isBomb){
    const fuse=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),fuseMat);
    fuse.position.y=0.34;m.add(fuse);
  }
  m.position.set(rand(-3.4,3.4),rand(6,8.5),rand(-1.5,1.8));
  m.userData={isBomb,vy:rand(2.2,3.2)*speedMul,spin:rand(1,4),dead:false};
  scene.add(m);items.push(m);
}

// catch burst particles (cheap: expanding fading ring of small boxes)
const bursts=[];
function burst(x,y,z,color){
  const g=new THREE.Group();
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});
  for(let i=0;i<8;i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.09),mat);
    const a=i/8*Math.PI*2;
    p.userData.v=new THREE.Vector3(Math.cos(a)*3,rand(1,3.5),Math.sin(a)*3);
    g.add(p);
  }
  g.position.set(x,y,z);scene.add(g);
  bursts.push({g,mat,t:0});
}

// ---------- game state ----------
let score=0,lives=3,combo=0,best=+(localStorage.getItem('starCatcherBest')||0);
let running=false,elapsed=0,spawnT=0,lastT=0;
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),
      comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay'),
      startBtn=document.getElementById('startBtn'),finalScore=document.getElementById('finalScore'),
      bestEl=document.getElementById('best'),flash=document.getElementById('flash');

function hud(){
  scoreEl.textContent=score;
  livesEl.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
  comboEl.textContent='x'+combo;
}
function reset(){
  for(const m of items)scene.remove(m);items.length=0;
  for(const b of bursts)scene.remove(b.g);bursts.length=0;
  score=0;lives=3;combo=0;elapsed=0;spawnT=0;basketX=0;targetX=0;hud();
}
function gameOver(){
  running=false;SFX.over();
  best=Math.max(best,score);localStorage.setItem('starCatcherBest',best);
  finalScore.style.display='block';finalScore.textContent=score+' pts';
  bestEl.style.display='block';bestEl.textContent='Best: '+best+' pts';
  startBtn.textContent='Play again';
  overlay.classList.remove('hide');
}
startBtn.addEventListener('click',()=>{SFX.ensure();reset();running=true;lastT=performance.now()/1000;overlay.classList.add('hide');});

// ---------- input: drag / mouse / keys ----------
let dragging=false;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
function pointerToX(cx){
  // map screen x to world x at basket depth
  const ndc=(cx/innerWidth)*2-1;
  return clamp(ndc*4.6,-3.4,3.4);
}
canvas.addEventListener('pointerdown',e=>{dragging=true;targetX=pointerToX(e.clientX);SFX.ensure();});
addEventListener('pointermove',e=>{if(dragging||e.pointerType==='mouse')targetX=pointerToX(e.clientX);});
addEventListener('pointerup',()=>{dragging=false;});

// ---------- loop ----------
function frame(){
  requestAnimationFrame(frame);
  const t=performance.now()/1000;
  let dt=Math.min(0.05,t-(lastT||t));lastT=t;
  if(document.hidden)dt=0;

  if(running&&dt>0){
    elapsed+=dt;
    const speedMul=1+elapsed*0.035;
    // keyboard
    if(keys.ArrowLeft||keys.KeyA)targetX-=7*dt;
    if(keys.ArrowRight||keys.KeyD)targetX+=7*dt;
    targetX=clamp(targetX,-3.4,3.4);
    basketX+=(targetX-basketX)*Math.min(1,dt*12);
    basket.position.x=basketX;

    spawnT-=dt;
    const interval=Math.max(0.3,0.95-elapsed*0.02);
    if(spawnT<=0){spawnT=interval;spawnItem(speedMul);}

    for(let i=items.length-1;i>=0;i--){
      const m=items[i],u=m.userData;
      m.position.y-=u.vy*dt;
      m.rotation.y+=u.spin*dt;m.rotation.x+=u.spin*0.6*dt;
      if(m.position.y<0.9&&!u.dead){
        const dx=Math.abs(m.position.x-basketX),dz=Math.abs(m.position.z-1.6);
        if(dx<0.75&&dz<1.0){
          // caught
          u.dead=true;scene.remove(m);items.splice(i,1);
          if(u.isBomb){
            lives--;combo=0;SFX.bomb();burst(basketX,1.2,1.6,0xff4444);
            flash.style.opacity=1;setTimeout(()=>flash.style.opacity=0,220);
            if(lives<=0){hud();gameOver();break;}
          }else{
            combo++;score+=10+(combo>=5?5:0);SFX.catch(combo);burst(basketX,1.2,1.6,0xffd54a);
          }
          hud();continue;
        }
      }
      if(m.position.y<-0.5){
        // missed (only reset combo for stars)
        if(!u.isBomb&&!u.dead)combo=0;
        scene.remove(m);items.splice(i,1);hud();
      }
    }
    // bursts
    for(let i=bursts.length-1;i>=0;i--){
      const b=bursts[i];b.t+=dt;
      for(const p of b.g.children)p.position.addScaledVector(p.userData.v,dt);
      b.mat.opacity=1-b.t*2;
      if(b.t>0.5){scene.remove(b.g);bursts.splice(i,1);}
    }
  }else{
    // idle: gentle basket sway + rotate stars
    basket.position.x=Math.sin(t*0.8)*0.6;
    for(const m of items){m.rotation.y+=dt*2;}
  }
  renderer.render(scene,camera);
}
function resize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);resize();hud();frame();
</script>
</body>
</html>
