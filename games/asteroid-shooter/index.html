<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Asteroid Shooter 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;color:#f1f5fd;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
  .pill{background:rgba(8,10,24,.72);border:1px solid rgba(125,211,252,.4);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700}
  .pill b{color:#7dd3fc}
  #flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(220,40,40,.6) 100%);opacity:0;transition:opacity .25s;z-index:4}
  #overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(4,6,15,.72);backdrop-filter:blur(6px)}
  #overlay.hide{display:none}
  #overlay .box{width:min(100%,420px);text-align:center;background:#10162e;border:1px solid #26304d;border-radius:18px;padding:32px 26px}
  #overlay h1{margin:0 0 8px;font-size:30px}
  #overlay p{margin:0 0 8px;color:#8b9bbd;font-size:15px;line-height:1.6}
  #overlay .big{font-size:44px;font-weight:800;color:#7dd3fc;margin:8px 0}
  #startBtn{margin-top:16px;width:100%;height:54px;border:0;border-radius:12px;background:#7dd3fc;color:#06283a;font-size:18px;font-weight:800;cursor:pointer}
  #startBtn:active{transform:translateY(2px)}
  #back{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
    padding:10px 16px;border-radius:999px;background:rgba(8,10,24,.72);border:1px solid #26304d;color:#8b9bbd;text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="pill">Score <b id="score">0</b></div>
  <div class="pill">Lives <b id="lives">♥♥♥</b></div>
  <div class="pill">Wave <b id="wave">1</b></div>
</div>
<div id="flash"></div>
<div id="overlay">
  <div class="box">
    <h1>🚀 Asteroid Shooter</h1>
    <p>Drag (or WASD / arrows) to steer your ship.<br>Auto-fire is on — smash every asteroid.<br>3 hits ends the run.</p>
    <div class="big" id="finalScore" style="display:none">0</div>
    <p id="best" style="display:none"></p>
    <button id="startBtn">Launch</button>
  </div>
</div>
<a id="back" href="../">← Games</a>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

const SFX={
  ctx:null,
  ensure(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{this.ctx=new C();}catch(e){return;}}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  tone(f,d=0.1,g=0.2,type='square',slide=null){if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn);gn.connect(c.destination);o.start(t);o.stop(t+d+0.05);},
  shoot(){this.tone(880,0.08,0.08,'square',220);},
  boom(){this.tone(140,0.25,0.3,'sawtooth',35);},
  hit(){this.tone(110,0.4,0.4,'sawtooth',30);},
  over(){[400,300,220,150].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,0.22,'triangle'),i*160));}
};

const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060f);
scene.fog=new THREE.Fog(0x05060f,14,34);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,100);
camera.position.set(0,2.4,6.2);camera.lookAt(0,1.2,-6);

scene.add(new THREE.HemisphereLight(0x8fb8ff,0x0a0a18,0.8));
const key=new THREE.DirectionalLight(0xffffff,1.4);key.position.set(3,6,4);scene.add(key);
const glow=new THREE.PointLight(0x7dd3fc,20,25);glow.position.set(0,2,-4);scene.add(glow);

// starfield
{
  const n=400,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){pos[i*3]=rand(-25,25);pos[i*3+1]=rand(-4,12);pos[i*3+2]=rand(-35,5);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbfd8ff,size:0.07})));
}

// ship
const ship=new THREE.Group();
{
  const hull=new THREE.Mesh(new THREE.ConeGeometry(0.32,1.1,12),
    new THREE.MeshStandardMaterial({color:0x7dd3fc,emissive:0x0a4a6a,emissiveIntensity:0.8,roughness:0.3}));
  hull.rotation.x=-Math.PI/2;ship.add(hull);
  const wingMat=new THREE.MeshStandardMaterial({color:0x1e3a5f,roughness:0.5});
  for(const s of [-1,1]){
    const w=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,0.4),wingMat);
    w.position.set(s*0.42,0,0.25);w.rotation.z=s*-0.15;ship.add(w);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),
      new THREE.MeshStandardMaterial({color:0xff5577,emissive:0xff0033,emissiveIntensity:1.5}));
    tip.position.set(s*0.75,0.05,0.25);ship.add(tip);
  }
  const flame=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.5,10),
    new THREE.MeshBasicMaterial({color:0xffaa33}));
  flame.rotation.x=Math.PI/2;flame.position.z=0.7;flame.name='flame';ship.add(flame);
}
ship.position.set(0,1.4,3.4);scene.add(ship);
let shipX=0,shipY=1.4,targetX=0,targetY=1.4;

const bullets=[],rocks=[],blasts=[];
const bulletGeo=new THREE.SphereGeometry(0.09,10,8);
const bulletMat=new THREE.MeshBasicMaterial({color:0x9fe8ff});
const rockGeo=new THREE.IcosahedronGeometry(0.5,0);
const rockMat=new THREE.MeshStandardMaterial({color:0x8a8f9e,roughness:0.9,flatShading:true});

let score=0,lives=3,wave=1,running=false,elapsed=0,spawnT=0,fireT=0,lastT=0,shake=0;
let best=+(localStorage.getItem('asteroidBest')||0);
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave'),
      overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),
      finalScore=document.getElementById('finalScore'),bestEl=document.getElementById('best'),
      flash=document.getElementById('flash');

function hud(){scoreEl.textContent=score;livesEl.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));waveEl.textContent=wave;}
function reset(){
  for(const b of bullets)scene.remove(b);bullets.length=0;
  for(const r of rocks)scene.remove(r);rocks.length=0;
  for(const e of blasts)scene.remove(e.g);blasts.length=0;
  score=0;lives=3;wave=1;elapsed=0;spawnT=0.5;fireT=0;shipX=0;shipY=1.4;targetX=0;targetY=1.4;hud();
}
function gameOver(){
  running=false;SFX.over();
  best=Math.max(best,score);localStorage.setItem('asteroidBest',best);
  finalScore.style.display='block';finalScore.textContent=score+' pts';
  bestEl.style.display='block';bestEl.textContent='Best: '+best+' pts';
  startBtn.textContent='Fly again';overlay.classList.remove('hide');
}
startBtn.addEventListener('click',()=>{SFX.ensure();reset();running=true;lastT=performance.now()/1000;overlay.classList.add('hide');});

function spawnRock(){
  const m=new THREE.Mesh(rockGeo,rockMat);
  const s=rand(0.5,1.3)*(1+wave*0.06);
  m.scale.setScalar(s);
  m.position.set(rand(-3.6,3.6),rand(0.3,3.4),-20);
  m.userData={vz:rand(4,6.5)+wave*0.5,rx:rand(-2,2),ry:rand(-2,2),r:s*0.5,dead:false};
  scene.add(m);rocks.push(m);
}
function blast(x,y,z,color=0xffcc66,big=1){
  const g=new THREE.Group();
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});
  for(let i=0;i<10;i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.12*big,0.12*big,0.12*big),mat);
    p.userData.v=new THREE.Vector3(rand(-4,4),rand(-3,4),rand(-4,4));
    g.add(p);
  }
  g.position.set(x,y,z);scene.add(g);blasts.push({g,mat,t:0});
}

// input
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
let dragging=false;
canvas.addEventListener('pointerdown',e=>{dragging=true;SFX.ensure();moveShip(e);});
addEventListener('pointermove',e=>{if(dragging)moveShip(e);});
addEventListener('pointerup',()=>dragging=false);
function moveShip(e){
  const nx=(e.clientX/innerWidth)*2-1,ny=(e.clientY/innerHeight)*2-1;
  targetX=clamp(nx*4.2,-3.6,3.6);
  targetY=clamp(1.8-ny*2.2,0.4,3.2);
}

function frame(){
  requestAnimationFrame(frame);
  const t=performance.now()/1000;
  let dt=Math.min(0.05,t-(lastT||t));lastT=t;
  if(document.hidden)dt=0;
  if(running&&dt>0){
    elapsed+=dt;wave=1+Math.floor(elapsed/18);
    const sp=7*dt;
    if(keys.ArrowLeft||keys.KeyA)targetX-=sp;
    if(keys.ArrowRight||keys.KeyD)targetX+=sp;
    if(keys.ArrowUp||keys.KeyW)targetY+=sp*0.7;
    if(keys.ArrowDown||keys.KeyS)targetY-=sp*0.7;
    targetX=clamp(targetX,-3.6,3.6);targetY=clamp(targetY,0.4,3.2);
    shipX+=(targetX-shipX)*Math.min(1,dt*10);
    shipY+=(targetY-shipY)*Math.min(1,dt*10);
    ship.position.set(shipX,shipY,3.4);
    ship.rotation.z=(shipX-targetX)*-0.12;
    ship.rotation.x=Math.sin(t*3)*0.03;
    ship.getObjectByName('flame').scale.set(1,1,1+Math.sin(t*30)*0.25);

    // fire
    fireT-=dt;
    if(fireT<=0){
      fireT=0.22;
      const b=new THREE.Mesh(bulletGeo,bulletMat);
      b.position.set(shipX,shipY,2.9);scene.add(b);bullets.push(b);SFX.shoot();
    }
    // spawn
    spawnT-=dt;
    if(spawnT<=0){spawnT=Math.max(0.35,1.1-wave*0.12);spawnRock();if(wave>=3&&Math.random()<0.4)spawnRock();}

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];b.position.z-=16*dt;
      if(b.position.z<-22){scene.remove(b);bullets.splice(i,1);}
    }
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i],u=r.userData;
      r.position.z+=u.vz*dt;r.rotation.x+=u.rx*dt;r.rotation.y+=u.ry*dt;
      if(r.position.z>5.6){scene.remove(r);rocks.splice(i,1);continue;}
      // hit ship?
      const dx=r.position.x-shipX,dy=r.position.y-shipY,dz=r.position.z-3.4;
      if(dx*dx+dy*dy+dz*dz<Math.pow(u.r+0.45,2)){
        scene.remove(r);rocks.splice(i,1);
        lives--;SFX.hit();blast(shipX,shipY,3.4,0xff4444,1.4);
        shake=0.35;flash.style.opacity=1;setTimeout(()=>flash.style.opacity=0,220);
        hud();if(lives<=0){gameOver();break;}continue;
      }
      // hit by bullet?
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        const bx=b.position.x-r.position.x,by=b.position.y-r.position.y,bz=b.position.z-r.position.z;
        if(bx*bx+by*by+bz*bz<Math.pow(u.r+0.25,2)){
          scene.remove(b);bullets.splice(j,1);
          scene.remove(r);rocks.splice(i,1);
          score+=10;SFX.boom();blast(r.position.x,r.position.y,r.position.z);hud();break;
        }
      }
    }
    hud();
    for(let i=blasts.length-1;i>=0;i--){
      const e=blasts[i];e.t+=dt;
      for(const p of e.g.children)p.position.addScaledVector(p.userData.v,dt);
      e.mat.opacity=1-e.t*2.2;
      if(e.t>0.45){scene.remove(e.g);blasts.splice(i,1);}
    }
    if(shake>0){shake-=dt;camera.position.x=rand(-1,1)*shake*0.5;camera.position.y=2.4+rand(-1,1)*shake*0.4;}
    else{camera.position.x=0;camera.position.y=2.4;}
  }
  renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();hud();frame();
</script>
</body>
</html>
